# Build the preview with the project's pinned Ruby and Bundler versions.
services:
  jekyll:
    image: chinmay-portfolio:local
    build: .
    working_dir: /srv/jekyll
    entrypoint: ["/bin/bash", "/srv/jekyll/bin/entry_point.sh"]
    ports:
      - 8080:8080
      - 35729:35729
    volumes:
      - .:/srv/jekyll
    environment:
      - JEKYLL_ENV=development
